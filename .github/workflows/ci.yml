name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  bundle:
    needs: checks
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/bundle.yml

name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          failed=0
          while read -r sha; do
            author_email=$(git log -1 --format=%ae "$sha")
            if ! git log -1 --format=%B "$sha" \
              | grep -i '^Signed-off-by:' \
              | grep -qiF "<$author_email>"; then
              subject=$(git log -1 --format=%s "$sha")
              echo "::error::Коммит $sha «$subject» без Signed-off-by для $author_email"
              failed=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..HEAD")
          if [ "$failed" -ne 0 ]; then
            echo "Подпишите коммиты: git commit -s или git rebase --signoff $BASE_SHA"
            exit 1
          fi

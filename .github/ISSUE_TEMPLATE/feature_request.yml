name: Предложение
description: Предложить функцию или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решает
      description: Опишите сценарий и текущие ограничения.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы и обходные пути
  - type: markdown
    attributes:
      value: |
        Текущие границы объёма описаны в
        [README](../blob/master/README.md) и
        [docs/limitations.md](../blob/master/docs/limitations.md).

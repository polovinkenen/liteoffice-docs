[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "src-tauri",
    "crates/app-core",
    "crates/docmodel",
    "crates/formats-core",
    "crates/formats-txt",
    "crates/formats-markdown",
    "crates/formats-html",
    "crates/formats-rtf",
    "crates/formats-docx",
    "crates/formats",
    "crates/export-pdf",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tempfile = "3"
typst = "=0.14.2"
typst-pdf = "=0.14.2"

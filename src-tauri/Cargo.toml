[package]
name = "liteoffice-docs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Кроссплатформенный редактор документов LiteOffice Docs"

[lib]
name = "liteoffice_docs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
app-core = { version = "0.1.0", path = "../crates/app-core" }
docmodel = { version = "0.1.0", path = "../crates/docmodel" }
formats = { version = "0.1.0", path = "../crates/formats" }
export-pdf = { version = "0.1.0", path = "../crates/export-pdf" }

[dev-dependencies]
tempfile.workspace = true

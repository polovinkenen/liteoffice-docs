<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>Таблицы</title></head>
<body>
<table>
<thead>
<tr><th colspan="2">Заголовок</th></tr>
</thead>
<tbody>
<tr><td rowspan="2">A</td><td>B</td></tr>
<tr><td>C</td></tr>
</tbody>
</table>
<ul data-type="taskList">
<li data-type="taskItem" data-checked="true"><p>Сделано</p></li>
<li data-type="taskItem" data-checked="false"><p>Не сделано</p></li>
</ul>
</body>
</html>

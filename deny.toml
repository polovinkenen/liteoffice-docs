# Конфигурация cargo-deny: уязвимости, лицензии, дубликаты и источники зависимостей.
# В cargo-deny 0.21 уязвимости всегда запрещены (поле `vulnerability` устарело),
# а `unmaintained` задаёт область проверки: all — вся графа зависимостей, поэтому
# unmaintained-адвизории транзитивных crates (typst, tauri) видны как warning.
# Проверка запускается с `-W unmaintained` (см. Makefile и CI), поэтому такие
# warnings печатаются, но не роняют проверку.

[advisories]
unmaintained = "all"
yanked = "deny"
# Уязвимости без доступного исправления в пределах текущих версий зависимостей.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml через typst (citationberg 0.6.1 фиксирует quick-xml 0.38.x, патч в >=0.41); в export-pdf bibliography/cite не используются, уязвимый путь не исполняется" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml через typst (citationberg 0.6.1 фиксирует quick-xml 0.38.x, патч в >=0.41); в export-pdf bibliography/cite не используются, уязвимый путь не исполняется" },
    { id = "RUSTSEC-2026-0367", reason = "docx-rs 0.4.22 требует zip ^8.6 и не поддерживает zip 9; WLite не вызывает ZipArchive::extract" },
    { id = "RUSTSEC-2026-0368", reason = "docx-rs 0.4.22 требует zip ^8.6 и не поддерживает zip 9; WLite не вызывает ZipArchive::extract" },
    { id = "RUSTSEC-2026-0369", reason = "docx-rs 0.4.22 требует zip ^8.6 и не поддерживает zip 9; WLite не вызывает ZipArchive::extract" },
    { id = "RUSTSEC-2026-0429", reason = "docx-rs 0.4.22 требует zip ^8.6 и не поддерживает zip 9; WLite не вызывает ZipArchive::extract" },
    { id = "RUSTSEC-2026-0545", reason = "docx-rs 0.4.22 требует zip ^8.6 и не поддерживает zip 9; фича zip aes-crypto не включена (default-features = false, features = [\"deflate\"]), код AES не компилируется, ZipArchive::extract и by_name_decrypt не вызываются" },
    { id = "RUSTSEC-2026-0546", reason = "docx-rs 0.4.22 требует zip ^8.6 и не поддерживает zip 9; WLite не вызывает ZipArchive::extract" },
    { id = "RUSTSEC-2026-0547", reason = "docx-rs 0.4.22 требует zip ^8.6 и не поддерживает zip 9; feature legacy-zip не включён" },
    { id = "RUSTSEC-2026-0548", reason = "docx-rs 0.4.22 требует zip ^8.6 и не поддерживает zip 9; ZipStreamReader не используется" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
wildcards = "deny"
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
